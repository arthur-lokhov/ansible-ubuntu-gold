# Two logical hosts share the same machine but are used at different moments:
#
#   livecd       - the temporary Ubuntu Live environment.  The install playbook
#                  runs here with connection=local and become=sudo.  Everything
#                  is written into /mnt (the target system), not into the
#                  LiveCD itself, except for the debootstrap/cryptsetup tools.
#
#   workstation  - the installed system after the first reboot.  The
#                  post-install playbook runs here.  It must be executed as
#                  root (for example via `doas ansible-playbook ...`) because
#                  opendoas is not a supported Ansible become plugin.
#
# To manage the installed system over SSH instead, replace ansible_connection
# with ssh and set ansible_host/ansible_user.  Note that the document leaves
# root SSH login disabled; use a normal user and run Ansible through `doas -s`.

all:
  children:
    livecd:
      hosts:
        livecd:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
          # The LiveCD user is normally `ubuntu` and has passwordless sudo.
          ansible_become: true
          ansible_become_method: sudo
    workstation:
      hosts:
        workstation:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
          # Post-install runs as root; see README.md.
          ansible_become: false
