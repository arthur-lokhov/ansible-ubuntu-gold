# ---------------------------------------------------------------------------
# Package manifest for the base system (document stage 3.4).
#
# The list follows the final `apt install` command from the document with the
# corrections stated in its prose:
#
#   * linux-tools-7.0.0-42-generic  -> linux-tools-generic-hwe-26.04
#     (a version-pinned tools package breaks after the first HWE kernel update)
#   * linux-perf is pulled in by linux-tools-generic-hwe-26.04, so it is not
#     listed separately
#   * manpages-posix-dev, qrencode, xfsdump and python3-rich are omitted
#     (the document explicitly excludes them from the final manifest)
#   * grub-theme-breeze is omitted: the boot role now uses GRUB's plain menu
#     (there is no theme to copy into /boot)
#   * plymouth-themes is omitted: the `text` theme selected by `plymouth_theme`
#     in main.yml ships in the base `plymouth` package; the graphical themes are
#     not used
#
# One package is added:
#   * systemd-zram-generator - the document writes /etc/systemd/zram-generator.conf,
#     which is consumed by this generator.  zram-tools is deliberately NOT
#     installed: it ships its own zramswap.service with a different config file,
#     would compete with the generator for /dev/zram0, and is not needed.
#
# Every package is installed with --no-install-recommends and the global APT
# policy has Install-Recommends=false, so anything critical must be listed
# explicitly (cracklib-runtime, publicsuffix, mesa-utils, xclip, etc.).
# ---------------------------------------------------------------------------

apt_packages:
  # --- kernel, boot chain, Secure Boot -------------------------------------
  # systemd and systemd-sysv are listed explicitly: debootstrap minbase does
  # not install the init system, and without systemd-sysv there is no /sbin/init
  # to hand over to after the initramfs.
  - systemd
  - systemd-sysv
  - linux-generic-hwe-26.04
  - grub-efi-amd64-signed
  - shim-signed
  - mokutil
  - efibootmgr
  - secureboot-db
  - os-prober
  - plymouth

  # --- storage: LUKS, LVM, XFS, initramfs ----------------------------------
  - cryptsetup-initramfs
  - lvm2
  - thin-provisioning-tools
  - xfsprogs
  - dosfstools
  - attr
  - initramfs-tools
  - util-linux-extra
  - fdisk

  # --- base CLI and editors -------------------------------------------------
  - zsh
  - opendoas
  - neovim
  - wget
  - curl
  - unzip
  - zip
  - zstd
