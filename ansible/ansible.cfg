# Ansible configuration for the Ubuntu 26.04 expert-install project.
#
# The project deliberately uses only ansible-core built-in modules and plugins:
# no collections, no external roles, no Galaxy dependencies.  That keeps the
# bootstrap reproducible on a freshly booted Ubuntu LiveCD, where downloading
# collections from the Internet is not always possible or desirable.

[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = True
interpreter_python = auto_silent
retry_files_enabled = False
nocows = True
deprecation_warnings = True
stdout_callback = default
forks = 1

# Keep temporary files out of the target chroot.  The install play runs on the
# LiveCD (connection=local), so this is mostly cosmetical, but it also makes the
# behaviour explicit for users who switch to SSH.
local_tmp = /tmp/ansible-ubuntu-gold

[ssh_connection]
pipelining = True
