---
# ---------------------------------------------------------------------------
# STAGE 1 - partitioning, LUKS2, LVM, XFS and the initial mount tree.
#
# Safety model:
#   * disk_confirm_wipe=true  -> wipefs + new GPT + new LUKS + new LVM.
#   * disk_confirm_wipe=false -> reuse existing partitions/headers/volumes and
#     only create what is missing.  This makes a failed run resumable.
#
# No fstab/crypttab is written here: the target /etc does not exist until
# debootstrap has run.  Both files are generated by the base_config role, using
# the UUID facts collected at the end of this role.
# ---------------------------------------------------------------------------

- name: Inspect the three target partitions
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ efi_partition }}"
    - "{{ boot_partition }}"
    - "{{ luks_partition }}"
  register: disk_part_stats

- name: Decide whether the existing partition layout can be reused
  ansible.builtin.set_fact:
    disk_partitions_ready: >-
      {{ disk_part_stats.results[0].stat.exists
         and disk_part_stats.results[1].stat.exists
         and disk_part_stats.results[2].stat.exists }}

- name: Require explicit confirmation before creating a new layout
  ansible.builtin.assert:
    that: disk_confirm_wipe | bool or disk_partitions_ready | bool
    fail_msg: >-
      {{ target_disk }} does not contain the expected three partitions.
      If this is a new installation, re-run with -e disk_confirm_wipe=true.
      THIS DESTROYS ALL DATA ON {{ target_disk }}.

- name: Release any previous installation before wiping
  when: disk_confirm_wipe | bool
  block:
    - name: Unmount a previous /mnt tree
      ansible.builtin.command: "umount -R {{ root_mnt }}"
      register: disk_umount_previous
      failed_when: false
      changed_when: false

    - name: Close a previously opened LUKS container
      ansible.builtin.command: "cryptsetup close {{ luks_name }}"
      register: disk_luks_close_previous
      failed_when: false
      changed_when: false

    - name: Deactivate a previously active volume group
      ansible.builtin.command: "vgchange -an {{ vg_name }}"
      register: disk_vg_deactivate_previous
      failed_when: false
      changed_when: false

    - name: Wipe signatures from the target disk
      ansible.builtin.command: "wipefs --all --force {{ target_disk }}"
      changed_when: true

- name: Compute partition boundaries in MiB
  ansible.builtin.set_fact:
    efi_start_mib: 1
    efi_end_mib: "{{ 1 + (efi_size_mib | int) }}"
    boot_start_mib: "{{ 1 + (efi_size_mib | int) }}"
    boot_end_mib: "{{ 1 + (efi_size_mib | int) + (boot_size_mib | int) }}"
    luks_start_mib: "{{ 1 + (efi_size_mib | int) + (boot_size_mib | int) }}"

- name: Force kernel to release the old partition table
  ansible.builtin.shell: |
    # Принудительно заставляем ядро перечитать таблицу разделов
    partprobe {{ target_disk }} || true
    blockdev --rereadpt {{ target_disk }} || true

    # Ждем, пока udev завершит обработку изменений
    udevadm settle
  changed_when: false
  failed_when: false

- name: Create a fresh GPT label
  ansible.builtin.command:
    cmd: "parted --script --align optimal {{ target_disk }} mklabel gpt"
  when: disk_confirm_wipe | bool

- name: Create the EFI System Partition
  ansible.builtin.command:
    cmd: >-
      parted --script --align optimal {{ target_disk }}
      mkpart efi fat32 {{ efi_start_mib }}MiB {{ efi_end_mib }}MiB
  when: disk_confirm_wipe | bool

- name: Mark the first partition as ESP
  ansible.builtin.command:
    cmd: "parted --script {{ target_disk }} set 1 esp on"
  when: disk_confirm_wipe | bool

- name: Create the unencrypted /boot partition
  ansible.builtin.command:
    cmd: >-
      parted --script --align optimal {{ target_disk }}
      mkpart boot ext4 {{ boot_start_mib }}MiB {{ boot_end_mib }}MiB
  when: disk_confirm_wipe | bool

- name: Create the LUKS partition using the remaining space
  ansible.builtin.command:
    cmd: >-
      parted --script --align optimal {{ target_disk }}
      mkpart cryptroot {{ luks_start_mib }}MiB 100%
  when: disk_confirm_wipe | bool

- name: Ask the kernel to re-read the partition table
  ansible.builtin.command: "partprobe {{ target_disk }}"
  when: disk_confirm_wipe | bool

- name: Wait for udev to settle
  ansible.builtin.command: udevadm settle
  changed_when: false
  when: disk_confirm_wipe | bool

- name: Wipe stale signatures from the new partitions
  ansible.builtin.command: "wipefs --all --force {{ item }}"
  loop:
    - "{{ efi_partition }}"
    - "{{ boot_partition }}"
    - "{{ luks_partition }}"
  failed_when: false
  changed_when: true
  when: disk_confirm_wipe | bool

- name: Check for an existing LUKS header
  ansible.builtin.command: "cryptsetup isLuks {{ luks_partition }}"
  register: disk_luks_check
  failed_when: false
  changed_when: false

# stdin is the passphrase WITHOUT a trailing newline: cryptsetup reads a key
# file verbatim, so a stray \n would become part of the LUKS key and the
# passphrase typed at boot would no longer match.
- name: Format the LUKS2 container
  ansible.builtin.command:
    cmd: >-
      cryptsetup luksFormat --batch-mode
      --type luks2
      --cipher {{ luks_cipher }}
      --key-size {{ luks_key_size }}
      --hash {{ luks_hash }}
      --iter-time {{ luks_iter_time }}
      --key-file - {{ luks_partition }}
  args:
    stdin: "{{ luks_passphrase }}"
  no_log: true
  when: disk_luks_check.rc != 0

- name: Check whether the LUKS container is already open
  ansible.builtin.stat:
    path: "/dev/mapper/{{ luks_name }}"
  register: disk_mapper

- name: Open the LUKS container
  ansible.builtin.command:
    cmd: "cryptsetup open --key-file - {{ luks_partition }} {{ luks_name }}"
  args:
    stdin: "{{ luks_passphrase }}"
  no_log: true
  when: not disk_mapper.stat.exists

- name: Check for an existing LVM physical volume
  ansible.builtin.command: "pvs /dev/mapper/{{ luks_name }}"
  register: disk_pvs
  failed_when: false
  changed_when: false

- name: Create the LVM physical volume
  ansible.builtin.command: "pvcreate /dev/mapper/{{ luks_name }}"
  when: disk_pvs.rc != 0

- name: Check for an existing volume group
  ansible.builtin.command: "vgs {{ vg_name }}"
  register: disk_vgs
  failed_when: false
  changed_when: false

- name: Create the volume group
  ansible.builtin.command: "vgcreate {{ vg_name }} /dev/mapper/{{ luks_name }}"
  when: disk_vgs.rc != 0

- name: Check which logical volumes already exist
  ansible.builtin.command: "lvs --noheadings {{ vg_name }}/{{ item.name }}"
  loop: "{{ lvm_volumes }}"
  register: disk_lv_checks
  failed_when: false
  changed_when: false
  loop_control:
    label: "{{ item.name }}"

- name: Create fixed-size logical volumes
  ansible.builtin.command:
    cmd: "lvcreate --yes --size {{ item.item.size }} --name {{ item.item.name }} {{ vg_name }}"
  loop: "{{ disk_lv_checks.results }}"
  when:
    - item.rc != 0
    - "'%' not in item.item.size"
  loop_control:
    label: "{{ item.item.name }} ({{ item.item.size }})"

- name: Create the remainder logical volume (100%FREE)
  ansible.builtin.command:
    cmd: "lvcreate --yes --extents {{ item.item.size }} --name {{ item.item.name }} {{ vg_name }}"
  loop: "{{ disk_lv_checks.results }}"
  when:
    - item.rc != 0
    - "'%' in item.item.size"
  loop_control:
    label: "{{ item.item.name }} ({{ item.item.size }})"

- name: Detect existing filesystems on logical volumes
  ansible.builtin.command: "blkid -s TYPE -o value /dev/{{ vg_name }}/{{ item.name }}"
  loop: "{{ lvm_volumes }}"
  register: disk_fs_checks
  failed_when: false
  changed_when: false
  loop_control:
    label: "{{ item.name }}"

- name: Create XFS on logical volumes that are not formatted
  ansible.builtin.command: "mkfs.xfs -f /dev/{{ vg_name }}/{{ item.item.name }}"
  loop: "{{ disk_fs_checks.results }}"
  when:
    - item.item.fstype == 'xfs'
    - item.stdout | trim == ''
  loop_control:
    label: "{{ item.item.name }}"

- name: Detect an existing filesystem on /boot
  ansible.builtin.command: "blkid -s TYPE -o value {{ boot_partition }}"
  register: disk_boot_fs
  failed_when: false
  changed_when: false

- name: Format /boot as ext4
  ansible.builtin.command: "mkfs.ext4 -F {{ boot_partition }}"
  when: disk_boot_fs.stdout | trim == ''

- name: Detect an existing filesystem on the ESP
  ansible.builtin.command: "blkid -s TYPE -o value {{ efi_partition }}"
  register: disk_efi_fs
  failed_when: false
  changed_when: false

- name: Format the ESP as FAT32
  ansible.builtin.command: "mkfs.vfat -F 32 {{ efi_partition }}"
  when: disk_efi_fs.stdout | trim == ''

- name: Check whether the root volume is already mounted
  ansible.builtin.command: "mountpoint -q {{ root_mnt }}"
  register: disk_root_mounted
  failed_when: false
  changed_when: false

- name: Mount the root volume
  ansible.builtin.command: "mount /dev/{{ vg_name }}/root {{ root_mnt }}"
  when: disk_root_mounted.rc != 0

- name: Create mount points below the new root
  ansible.builtin.file:
    path: "{{ root_mnt }}{{ item.mountpoint }}"
    state: directory
    mode: "0755"
  loop: "{{ lvm_volumes }}"
  when: item.mountpoint != '/'

- name: Create /boot/efi inside the target tree
  ansible.builtin.file:
    path: "{{ root_mnt }}/boot/efi"
    state: directory
    mode: "0755"

- name: Check whether /boot is already mounted
  ansible.builtin.command: "mountpoint -q {{ root_mnt }}/boot"
  register: disk_boot_mount_check
  failed_when: false
  changed_when: false

- name: Mount the unencrypted /boot partition
  ansible.builtin.command: "mount {{ boot_partition }} {{ root_mnt }}/boot"
  when: disk_boot_mount_check.rc != 0

- name: Check whether the ESP is already mounted
  ansible.builtin.command: "mountpoint -q {{ root_mnt }}/boot/efi"
  register: disk_efi_mount_check
  failed_when: false
  changed_when: false

- name: Mount the EFI System Partition
  ansible.builtin.command: "mount {{ efi_partition }} {{ root_mnt }}/boot/efi"
  when: disk_efi_mount_check.rc != 0

- name: Check which target mount points are active
  ansible.builtin.command: "mountpoint -q {{ root_mnt }}{{ item.mountpoint }}"
  loop: "{{ lvm_volumes }}"
  register: disk_mount_checks
  failed_when: false
  changed_when: false
  loop_control:
    label: "{{ item.mountpoint }}"

- name: Mount the remaining LVM volumes
  ansible.builtin.command:
    cmd: "mount /dev/{{ vg_name }}/{{ item.item.name }} {{ root_mnt }}{{ item.item.mountpoint }}"
  loop: "{{ disk_mount_checks.results }}"
  when:
    - item.item.mountpoint != '/'
    - item.rc != 0
  loop_control:
    label: "{{ item.item.mountpoint }}"

- name: Initialise the device list for UUID collection
  ansible.builtin.set_fact:
    uuid_devices: []

- name: Add logical volumes to the UUID device list
  ansible.builtin.set_fact:
    uuid_devices: >-
      {{ uuid_devices
         + [{'name': item.name, 'device': '/dev/' ~ vg_name ~ '/' ~ item.name}] }}
  loop: "{{ lvm_volumes }}"
  loop_control:
    label: "{{ item.name }}"

- name: Add /boot and the ESP to the UUID device list
  ansible.builtin.set_fact:
    uuid_devices: >-
      {{ uuid_devices
         + [{'name': 'boot', 'device': boot_partition},
            {'name': 'efi',  'device': efi_partition}] }}

- name: Collect filesystem UUIDs
  ansible.builtin.command: "blkid -s UUID -o value {{ item.device }}"
  loop: "{{ uuid_devices }}"
  register: disk_uuid_queries
  changed_when: false
  loop_control:
    label: "{{ item.name }}"

- name: Initialise the UUID map
  ansible.builtin.set_fact:
    fs_uuids: {}

- name: Build the UUID map
  ansible.builtin.set_fact:
    fs_uuids: "{{ fs_uuids | combine({ item.item.name: item.stdout | trim }) }}"
  loop: "{{ disk_uuid_queries.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Read the LUKS UUID
  ansible.builtin.command: "cryptsetup luksUUID {{ luks_partition }}"
  register: disk_luks_uuid
  changed_when: false

- name: Store the LUKS UUID for crypttab
  ansible.builtin.set_fact:
    luks_uuid: "{{ disk_luks_uuid.stdout | trim }}"

- name: Verify that every UUID was collected
  ansible.builtin.assert:
    that:
      - luks_uuid | length > 0
      - fs_uuids | length == (lvm_volumes | length) + 2
      - fs_uuids.values() | select('equalto', '') | list | length == 0
    fail_msg: >-
      Failed to collect all filesystem UUIDs.  Inspect `blkid` and the mounts
      under {{ root_mnt }}.  fstab will not be written with incomplete data.

- name: Show the resulting layout
  ansible.builtin.debug:
    msg:
      - "LUKS UUID: {{ luks_uuid }}"
      - "UUIDs: {{ fs_uuids }}"
      - "Mounted: {{ root_mnt }} (/), {{ root_mnt }}/boot, {{ root_mnt }}/boot/efi, plus LVM volumes"
